[project]
name = "staticx"
dynamic = ["version"]

authors = [
    {name = "Jonathon Reinhart", email="jonathon.reinhart@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pyelftools",
]
description = "Build static self-extracting app from dynamic executable"
license = {file = "LICENSE.txt"}
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
staticx = "staticx.__main__:main"
sx-extract = "staticx.extract:main"

[project.urls]
documentation = "https://staticx.readthedocs.io/"
repository = "https://github.com/JonathonReinhart/staticx"
changelog = "https://github.com/JonathonReinhart/staticx/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "cffi",  # Used for test/pyinstall-cffi/
    "mypy",
    "pyinstaller",
    "pytest",
    "ruff~=0.15",
    "scons",  # Used for test/nss-isolated/
    "scuba",
    "types-pyinstaller",
]

[build-system]
# Tells pip to install wheel before trying to install
# from an sdist or from Github.
requires = [
    "wheel",
    "setuptools >= 42.0.0",
    "scons",
]

# mypy
[tool.mypy]
python_version = "3.10"
mypy_path = "$MYPY_CONFIG_FILE_DIR/stubs"
warn_unused_configs = true
warn_return_any = true
packages = ["staticx"]

[[tool.mypy.overrides]]
module = "staticx.*"
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# ruff
# https://docs.astral.sh/ruff/configuration/
[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "E4",  # pycodestyle: Import
    "E7",  # pycodestyle: Statement
    "E9",  # pycodestyle: Runtime
    "F",   # Pyflakes
    "FLY", # flynt
    "I",   # isort
    "N",   # pep8-naming
    "RUF", # Ruff-specific rules
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# Ignore pep8-naming (N) rules in site_scons and setup.py.
"site_scons/**.py" = ["N"]
"setup.py" = ["N", "RUF"]
